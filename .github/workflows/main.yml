name: Unity Project Notifier

on: [push]

jobs:
  discord-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Format Commit Message
        id: vars
        run: |
          MSG="${{ github.event.head_commit.message }}"
          TITLE=$(echo "$MSG" | head -n 1)
          BODY=$(echo "$MSG" | tail -n +2 | xargs)
          echo "commit_title=$TITLE" >> $GITHUB_OUTPUT
          echo "commit_body=$BODY" >> $GITHUB_OUTPUT

      - name: Send Message to Discord
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          nodetail: true
          title: "Update for ${{ github.event.repository.name }}"
          description: |
            **Message:**
            ${{ steps.vars.outputs.commit_title }}

            **Description:**
            ${{ steps.vars.outputs.commit_body }}

            **Author:**
            ${{ github.actor }}
          # This one-liner ensures the JSON format is perfect
          fields: '[{"name": "Repository", "value": "[${{ github.repository }}](https://github.com/${{ github.repository }})", "inline": true}, {"name": "Branch", "value": "`${{ github.ref_name }}`", "inline": true}]'
          color: 0x7289da
          url: "https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
