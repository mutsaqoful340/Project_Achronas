name: Unity Project Notifier

on: [push]

jobs:
  discord-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Format Commit Message
        id: vars
        run: |
          MSG="${{ github.event.head_commit.message }}"
          
          # Get the first line as Title
          TITLE=$(echo "$MSG" | head -n 1)
          echo "commit_title=$TITLE" >> $GITHUB_OUTPUT
          
          # Get everything ELSE as the Body and preserve newlines
          {
            echo "commit_body<<EOF"
            echo "$MSG" | tail -n +2
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Message to Discord
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          content: "<@&1468586352797810821> A push has been made."
          nodetail: true
          title: "Update for ${{ github.event.repository.name }}"
          description: |
            **Change Title:**
            ${{ steps.vars.outputs.commit_title }}

            **Description:**
            ${{ steps.vars.outputs.commit_body }}

            **Author:** ${{ github.actor }}

            **Repo:** [${{ github.repository }}](https://github.com/${{ github.repository }}) | **Branch:** `${{ github.ref_name }}`
          color: 0x7289da
          url: "https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
