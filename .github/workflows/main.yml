name: Unity Project Notifier

on: [push]

jobs:
  discord-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Format Multiple Commits
        id: vars
        shell: bash
        run: |
          # 1. Get the full list of commits as JSON
          COMMITS_JSON='${{ toJson(github.event.commits) }}'
          
          # 2. Use jq to loop through each commit and format the output
          # This creates a block for each commit: **Title** followed by the body.
          FORMATTED_COMMITS=$(echo "$COMMITS_JSON" | jq -r '.[] | "**Change Title:** " + (.message | split("\n")[0]) + "\n**Description:** " + (.message | split("\n")[1:] | join("\n") | sub("^\\s+"; "")) + "\n"')

          # 3. Output the combined list safely
          {
            echo "commit_details<<EOF"
            echo "$FORMATTED_COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Message to Discord
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          content: "<@&1468586352797810821> A push has been made with multiple updates."
          nodetail: true
          title: "Update for ${{ github.event.repository.name }}"
          description: |
            ${{ steps.vars.outputs.commit_details }}

            **Author:** ${{ github.actor }}

            **Repo:** [${{ github.repository }}](https://github.com/${{ github.repository }}) | **Branch:** `${{ github.ref_name }}`
          color: 0x7289da
          url: "https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}"
