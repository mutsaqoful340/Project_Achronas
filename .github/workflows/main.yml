name: Unity Project Notifier

on: [push]

jobs:
  discord-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Format Commit Message
        id: vars
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # 1. Get the first line as Title
          TITLE=$(echo "$COMMIT_MSG" | head -n 1)
          echo "commit_title=$TITLE" >> $GITHUB_OUTPUT
          
          # 2. Extract Co-authors from trailers (e.g., Co-authored-by: Name <email>)
          # This grabs the name, trims whitespace, and joins them with '&'
          CO_AUTHORS=$(echo "$COMMIT_MSG" | grep -i "Co-authored-by:" | sed -E 's/Co-authored-by: ([^<]+).*/\1/i' | sed 's/[[:space:]]*$//' | paste -sd "&" - | sed 's/^/ \& /' || echo "")
          echo "authors=${{ github.actor }}$CO_AUTHORS" >> $GITHUB_OUTPUT
          
          # 3. Get the rest, trim leading empty lines
          {
            echo "commit_body<<EOF"
            echo "$COMMIT_MSG" | tail -n +2 | sed '/./,$!d'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Message to Discord
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          content: "<@&1468586352797810821> A push has been made."
          nodetail: true
          title: "Update for ${{ github.event.repository.name }}"
          description: |
            **Change Title:** ${{ steps.vars.outputs.commit_title }}

            **Description:** ${{ steps.vars.outputs.commit_body }}

            **Author:** ${{ steps.vars.outputs.authors }}

            **Repo:** [${{ github.repository }}](https://github.com/${{ github.repository }}) | **Branch:** `${{ github.ref_name }}`
          color: 0x7289da
          url: "https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
